# Una medición contra el banco de pruebas (ADR 0014), en un Docker Compose aparte con su propia base
# y su propio Kafka. Se suma a compose.yaml y se le da un nombre de proyecto propio:
#
#   docker compose -p el-parte-banco-<medición> -f compose.yaml -f compose.banco.yaml up --build
#
# Las variables van en el entorno o en el .env de la raíz: ELPARTE_BANCO_MEDICION, ELPARTE_BANCO_DESDE
# y ELPARTE_BANCO_HASTA, y si se quiere ELPARTE_BANCO_COSTO_MAXIMO_USD, ELPARTE_CORRIDA_COSTO_MAXIMO_USD,
# ELPARTE_CORRIDA_PASOS_MAXIMOS y ELPARTE_COMMIT. Si falta
# alguna, la aplicación lo dice en su registro y no mide; los demás comandos (ps, logs, down) andan sin
# ellas. La aplicación de la medición queda en http://localhost:8081, y la salida, en
# banco-de-pruebas/mediciones/<medición>/. Cómo se usa: app/README.md, "Medir contra el banco".

services:
  base:
    ports: !reset []
  kafka:
    ports: !reset []
  correo:
    ports: !reset []
  aplicacion:
    # La salida se escribe en una carpeta del clon montada en el contenedor. El usuario sin privilegios
    # de la imagen no puede escribir ahí en Linux, donde la carpeta es de otro usuario; esta
    # aplicación, que corre solo para medir, lo hace como root.
    user: root
    ports: !override
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: banco
      ELPARTE_BANCO_MEDICION: ${ELPARTE_BANCO_MEDICION:-}
      ELPARTE_BANCO_DESDE: ${ELPARTE_BANCO_DESDE:-}
      ELPARTE_BANCO_HASTA: ${ELPARTE_BANCO_HASTA:-}
      ELPARTE_BANCO_COSTO_MAXIMO_USD: ${ELPARTE_BANCO_COSTO_MAXIMO_USD:-5.00}
      # El presupuesto de cada noche (ADR 0005); por omisión, el de application.yaml.
      ELPARTE_CORRIDA_COSTO_MAXIMO_USD: ${ELPARTE_CORRIDA_COSTO_MAXIMO_USD:-0.50}
      ELPARTE_CORRIDA_PASOS_MAXIMOS: ${ELPARTE_CORRIDA_PASOS_MAXIMOS:-200}
      ELPARTE_COMMIT: ${ELPARTE_COMMIT:-}
    volumes:
      - ./banco-de-pruebas/mediciones:/mediciones
