# Configuración de El Parte. Los valores de conexión vienen de compose.yaml;
# los de esta página son los de una ejecución local sin Docker.
spring:
  application:
    name: el-parte

  # La aplicación se conecta con el rol de los agentes, que no ve el esquema `cuentas`;
  # las migraciones corren con el dueño de la base (docs/base-de-afirmaciones.md).
  datasource:
    url: ${BASE_URL:jdbc:postgresql://localhost:5432/elparte}
    username: ${BASE_USUARIO:elparte_agentes}
    password: ${BASE_CLAVE:agentes-local}

  flyway:
    user: ${BASE_DUENO_USUARIO:elparte}
    password: ${BASE_DUENO_CLAVE:elparte}
    placeholders:
      rol_agentes: ${BASE_USUARIO:elparte_agentes}
      clave_agentes: ${BASE_CLAVE:agentes-local}
      rol_cuentas: elparte_cuentas
      clave_cuentas: ${BASE_CLAVE_CUENTAS:cuentas-local}

  # El correo del enlace para entrar (ADR 0013): en local, Mailpit, sin usuario ni SSL; publicada,
  # Resend, con su usuario, la clave del .env y SSL (compose.publicado.yaml, ADR 0016).
  mail:
    host: ${CORREO_HOST:localhost}
    port: ${CORREO_PUERTO:1025}
    username: ${CORREO_USUARIO:}
    password: ${CORREO_CLAVE:}
    properties:
      "[mail.smtp.auth]": ${CORREO_AUTENTICA:false}
      "[mail.smtp.ssl.enable]": ${CORREO_SSL:false}
      # El enlace se manda mientras la persona espera la página: si el servidor no contesta, se corta.
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000

  kafka:
    bootstrap-servers: ${KAFKA_SERVIDORES:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      # Cada mensaje puede llevar una llamada al modelo: se piden pocos por vez, y la exploración de
      # una noche puede tardar minutos sin que Kafka saque al consumidor del grupo.
      max-poll-records: 5
      properties:
        max.poll.interval.ms: 3600000

  ai:
    anthropic:
      # La clave sale del .env de la máquina que corre las noches reales (T14).
      # Sin clave, la aplicación arranca igual; solo fallan las llamadas al modelo.
      api-key: ${ANTHROPIC_API_KEY:sin-clave}
      chat:
        # Valor por omisión; cada agente usa el de su corrida (ADR 0003).
        model: claude-haiku-5-5

elparte:
  # El acceso (ADR 0013). La lista de invitados no va acá: va en el entorno, como ELPARTE_INVITADOS_0_CORREO,
  # ELPARTE_INVITADOS_0_ALIAS y ELPARTE_INVITADOS_0_RESPONSABLE (app/README.md, "Los invitados").
  acceso:
    url-publica: ${ELPARTE_URL_PUBLICA:http://localhost:8080}
    remitente: ${ELPARTE_REMITENTE:El Parte <parte@localhost>}
  cuentas:
    usuario: elparte_cuentas
    clave: ${BASE_CLAVE_CUENTAS:cuentas-local}
  arce:
    url-base: ${ARCE_URL_BASE:https://www.comprasestatales.gub.uy/ocds}
    # Además de la noche objetivo, se lee el día anterior, por lo que ARCE publica con atraso.
    dias-de-margen: 1
    concurrencia: 4
    # Espera antes de cada pedido a ARCE. Las noches de todos los días no esperan; la medición contra
    # el banco sí (application-banco.yaml, ADR 0014).
    pausa-ms: 0
  corrida:
    # Medido contra el banco: la noche más cara costó 1,14 USD (ADR 0005, valores calibrados).
    costo-maximo-usd: 1.25
    pasos-maximos: 200
    minutos-maximos: 45
    # Corrida por reloj, en hora de Uruguay: "-" la apaga; "06:00" corre la noche de ayer apenas pasan
    # las 6. Se revisa cada revisar-cada-ms, así se pone al día después de una pausa o un apagón (T43).
    hora: "-"
    revisar-cada-ms: 300000
  # La medición contra el banco (ADR 0014). La arranca el perfil banco; ver application-banco.yaml.
  banco:
    entidad: organismo:bps
    # Tope de gasto en el modelo para toda la medición, hasta saber cuánto cuesta una noche.
    costo-maximo-usd: 5.00
    carpeta: /mediciones
    espera-ms: 2000

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    # El cliente de Kafka escribe su configuración entera cada vez que se crea;
    # el indicador de salud crea uno en cada consulta.
    org.apache.kafka.clients.admin.AdminClientConfig: warn
    org.apache.kafka.clients.consumer.ConsumerConfig: warn
    org.apache.kafka.clients.producer.ProducerConfig: warn
    org.apache.kafka.common.utils.AppInfoParser: warn
    org.apache.kafka.common.metrics.Metrics: warn
