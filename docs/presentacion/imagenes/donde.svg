<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="370" viewBox="0 0 1600 370" role="img" aria-label="El plan en cuatro fines de semana: los dos primeros hechos, el tercero empezado y el cuarto pendiente, con la marca de hoy entre el segundo y el tercero">
<line x1="200" y1="130" x2="800" y2="130" stroke="#17263A" stroke-width="6" stroke-linecap="round"/>
<line x1="800" y1="130" x2="1400" y2="130" stroke="#8C96A3" stroke-width="6" stroke-linecap="round" stroke-dasharray="14 12"/>
<line x1="800" y1="52" x2="800" y2="110" stroke="#B4491F" stroke-width="3" stroke-dasharray="6 6"/>
<text x="800" y="36" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#8A3415" text-anchor="middle">Hoy, 16 de noviembre</text>
<circle cx="200" cy="130" r="40" fill="#17263A"/>
<path d="M 182 132 L 195 145 L 220 116" fill="none" stroke="#F6F2E9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="600" cy="130" r="40" fill="#17263A"/>
<path d="M 582 132 L 595 145 L 620 116" fill="none" stroke="#F6F2E9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="1000" cy="130" r="40" fill="#FBE9DD" stroke="#B4491F" stroke-width="6"/>
<path d="M 1000 93 A 37 37 0 0 0 1000 167 Z" fill="#B4491F"/>
<circle cx="1400" cy="130" r="40" fill="#F6F2E9" stroke="#8C96A3" stroke-width="6"/>
<text x="200" y="215" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#17263A" text-anchor="middle">7 y 8 de noviembre</text>
<text x="200" y="252" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="middle">Documentación: el plan,</text>
<text x="200" y="284" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="middle">las decisiones y cómo</text>
<text x="200" y="316" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="middle">se hablan los agentes</text>
<text x="200" y="352" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#17263A" text-anchor="middle">Hecho</text>
<text x="600" y="215" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#17263A" text-anchor="middle">14 y 15 de noviembre</text>
<text x="600" y="252" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="middle">La primera rebanada:</text>
<text x="600" y="284" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="middle">una fuente, de la red</text>
<text x="600" y="316" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="middle">a la página de la mañana</text>
<text x="600" y="352" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#17263A" text-anchor="middle">Hecho</text>
<text x="1000" y="215" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#17263A" text-anchor="middle">21 y 22 de noviembre</text>
<text x="1000" y="252" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="middle">La medición contra la</text>
<text x="1000" y="284" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="middle">vigilancia anterior y</text>
<text x="1000" y="316" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="middle">el analista completo</text>
<text x="1000" y="352" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#8A3415" text-anchor="middle">Empezado: medición corrida</text>
<text x="1400" y="215" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#17263A" text-anchor="middle">28 y 29 de noviembre</text>
<text x="1400" y="252" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="middle">Las otras cuatro fuentes,</text>
<text x="1400" y="284" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="middle">los usuarios y la</text>
<text x="1400" y="316" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="middle">demostración</text>
<text x="1400" y="352" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#4A5361" text-anchor="middle">Pendiente</text>
</svg>
