<text x="160" y="215" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#17263A" text-anchor="middle">Documentación</text>
<text x="160" y="252" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="middle">El plan, las decisiones</text>
<text x="160" y="284" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="middle">y cómo se hablan</text>
<text x="160" y="316" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="middle">los agentes</text>
<text x="480" y="215" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#17263A" text-anchor="middle">Primera rebanada</text>
<text x="480" y="252" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="middle">Una fuente, de la red</text>
<text x="480" y="284" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="middle">a la página de</text>
<text x="480" y="316" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="middle">la mañana</text>
<text x="800" y="215" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#17263A" text-anchor="middle">Medición</text>
<text x="800" y="252" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="middle">78 noches contra la</text>
<text x="800" y="284" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="middle">vigilancia anterior</text>
<text x="1120" y="215" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#17263A" text-anchor="middle">Cinco fuentes</text>
<text x="1120" y="252" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="middle">Las otras cuatro</text>
<text x="1120" y="284" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="middle">fuentes y los</text>
<text x="1120" y="316" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="middle">usuarios invitados</text>
<text x="1440" y="215" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#17263A" text-anchor="middle">Publicado</text>
<text x="1440" y="252" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="middle">Con aviso por correo</text>
<text x="1440" y="284" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="middle">y el expediente de</text>
<text x="1440" y="316" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="middle">cada entidad</text>
</svg>
