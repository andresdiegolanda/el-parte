<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-label="Cinco agentes en fila, del explorador al editor, y un observador arriba que mide a todos">
<rect x="96" y="229" width="1408" height="14" rx="7" fill="#DDD5C3"/>
<line x1="800" y1="92" x2="160" y2="172" stroke="#8C96A3" stroke-width="3" stroke-dasharray="8 10" stroke-linecap="round"/>
<line x1="800" y1="92" x2="480" y2="172" stroke="#8C96A3" stroke-width="3" stroke-dasharray="8 10" stroke-linecap="round"/>
<line x1="800" y1="92" x2="800" y2="172" stroke="#8C96A3" stroke-width="3" stroke-dasharray="8 10" stroke-linecap="round"/>
<line x1="800" y1="92" x2="1120" y2="172" stroke="#8C96A3" stroke-width="3" stroke-dasharray="8 10" stroke-linecap="round"/>
<line x1="800" y1="92" x2="1440" y2="172" stroke="#8C96A3" stroke-width="3" stroke-dasharray="8 10" stroke-linecap="round"/>
<path d="M 740 58 Q 800 10 860 58 Q 800 106 740 58 Z" fill="#F6F2E9" stroke="#4A5361" stroke-width="5" stroke-linejoin="round"/>
<circle cx="800" cy="58" r="14" fill="#4A5361"/>
<text x="880" y="46" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#4A5361" text-anchor="start"><tspan font-weight="bold" fill="#17263A">Observador</tspan>: mide el costo, el tiempo</text>
<text x="880" y="80" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#4A5361" text-anchor="start">y los aciertos de cada uno.</text>
<path d="M 313 224 L 327 236 L 313 248" fill="none" stroke="#8C96A3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 633 224 L 647 236 L 633 248" fill="none" stroke="#8C96A3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 953 224 L 967 236 L 953 248" fill="none" stroke="#8C96A3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1273 224 L 1287 236 L 1273 248" fill="none" stroke="#8C96A3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="160" cy="236" r="64" fill="#17263A"/>
<circle cx="480" cy="236" r="64" fill="#17263A"/>
<circle cx="800" cy="236" r="64" fill="#B4491F"/>
<circle cx="1120" cy="236" r="64" fill="#17263A"/>
<circle cx="1440" cy="236" r="64" fill="#17263A"/>
<g fill="none" stroke="#F6F2E9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><circle cx="150" cy="226" r="22"/><line x1="166" y1="242" x2="186" y2="262"/><rect x="448" y="210" width="64" height="52" rx="6"/><line x1="448" y1="230" x2="512" y2="230"/><path d="M 800 200 L 830 212 L 826 246 Q 818 266 800 274 Q 782 266 774 246 L 770 212 Z"/><path d="M 786 236 L 797 247 L 815 226"/><circle cx="1120" cy="224" r="22"/><line x1="1110" y1="256" x2="1130" y2="256"/><line x1="1113" y1="266" x2="1127" y2="266"/><rect x="1416" y="204" width="48" height="64" rx="6"/><line x1="1426" y1="222" x2="1454" y2="222"/><line x1="1426" y1="236" x2="1454" y2="236"/><line x1="1426" y1="250" x2="1444" y2="250"/></g>
<rect x="470" y="240" width="20" height="6" rx="3" fill="#F6F2E9"/>
<text x="160" y="350" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#17263A" text-anchor="middle">Exploradores</text>
<text x="160" y="388" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="middle">uno por fuente, buscan</text>
<text x="160" y="420" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="middle">lo publicado esa noche</text>
<text x="480" y="350" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#17263A" text-anchor="middle">Archivista</text>
<text x="480" y="388" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="middle">se acuerda de lo ya visto:</text>
<text x="480" y="420" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="middle">¿es nuevo?</text>
<text x="800" y="350" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#17263A" text-anchor="middle">Refutador</text>
<text x="800" y="388" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="middle">intenta demostrar</text>
<text x="800" y="420" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="middle">que es falso</text>
<text x="1120" y="350" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#17263A" text-anchor="middle">Analista</text>
<text x="1120" y="388" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="middle">explica qué dice y</text>
<text x="1120" y="420" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="middle">por qué importa</text>
<text x="1440" y="350" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#17263A" text-anchor="middle">Editor</text>
<text x="1440" y="388" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="middle">arma la página</text>
<text x="1440" y="420" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="middle">de la mañana</text>
</svg>
