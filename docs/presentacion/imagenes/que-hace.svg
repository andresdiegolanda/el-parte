<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="430" viewBox="0 0 1600 430" role="img" aria-label="Tres pasos: elegís a quién seguir, de noche lee las fuentes, a la mañana te avisa">
<rect x="0" y="0" width="500" height="430" rx="22" fill="#FFFDF7" stroke="#DDD5C3" stroke-width="2"/>
<g transform="translate(40 36)"><rect x="10" y="14" width="180" height="30" rx="15" fill="#E7E0CF"/><circle cx="34" cy="29" r="8" fill="#C9BFA9"/><rect x="54" y="25" width="90" height="8" rx="4" fill="#C9BFA9"/><rect x="10" y="55" width="180" height="30" rx="15" fill="#17263A"/><circle cx="34" cy="70" r="8" fill="#F0A27A"/><rect x="54" y="66" width="100" height="8" rx="4" fill="#F6F2E9"/><rect x="10" y="96" width="180" height="30" rx="15" fill="#E7E0CF"/><circle cx="34" cy="111" r="8" fill="#C9BFA9"/><rect x="54" y="107" width="80" height="8" rx="4" fill="#C9BFA9"/></g>
<text x="40" y="238" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#17263A" text-anchor="start">1. Elegís a quién seguir</text>
<text x="40" y="284" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="start">Un organismo, una empresa,</text>
<text x="40" y="318" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="start">un programa o una licitación.</text>
<rect x="550" y="0" width="500" height="430" rx="22" fill="#FFFDF7" stroke="#DDD5C3" stroke-width="2"/>
<g transform="translate(590 36)"><rect width="200" height="140" rx="18" fill="#17263A"/><circle cx="156" cy="38" r="20" fill="#F0A27A"/><circle cx="166" cy="31" r="18" fill="#17263A"/><circle cx="40" cy="26" r="2.5" fill="#C4CDD8"/><circle cx="72" cy="18" r="2.5" fill="#C4CDD8"/><circle cx="110" cy="30" r="2.5" fill="#C4CDD8"/><g transform="translate(24 66) rotate(-8 20 27)"><rect width="40" height="54" rx="5" fill="#24364D" stroke="#4F6A8C" stroke-width="2"/><rect x="8" y="12" width="24" height="5" rx="2.5" fill="#4F6A8C"/><rect x="8" y="24" width="18" height="5" rx="2.5" fill="#4F6A8C"/></g><g transform="translate(78 62) rotate(6 20 27)"><rect width="40" height="54" rx="5" fill="#24364D" stroke="#4F6A8C" stroke-width="2"/><rect x="8" y="12" width="24" height="5" rx="2.5" fill="#4F6A8C"/><rect x="8" y="24" width="18" height="5" rx="2.5" fill="#4F6A8C"/></g><g transform="translate(132 70) rotate(-4 20 27)"><rect width="40" height="54" rx="5" fill="#24364D" stroke="#4F6A8C" stroke-width="2"/><rect x="8" y="12" width="24" height="5" rx="2.5" fill="#4F6A8C"/><rect x="8" y="24" width="18" height="5" rx="2.5" fill="#4F6A8C"/></g></g>
<text x="590" y="238" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#17263A" text-anchor="start">2. De noche, lee las fuentes</text>
<text x="590" y="284" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="start">Lo que publicaron ese día las</text>
<text x="590" y="318" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="start">fuentes públicas del Estado y</text>
<text x="590" y="352" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="start">de la banca de desarrollo.</text>
<rect x="1100" y="0" width="500" height="430" rx="22" fill="#FFFDF7" stroke="#DDD5C3" stroke-width="2"/>
<g transform="translate(1140 36)"><rect width="200" height="140" rx="18" fill="#FBE9DD"/><circle cx="46" cy="46" r="20" fill="#B4491F"/><g stroke="#B4491F" stroke-width="4" stroke-linecap="round"><line x1="74" y1="46" x2="82" y2="46"/><line x1="18" y1="46" x2="10" y2="46"/><line x1="46" y1="74" x2="46" y2="82"/><line x1="46" y1="18" x2="46" y2="10"/><line x1="65.8" y1="65.8" x2="71.5" y2="71.5"/><line x1="26.2" y1="65.8" x2="20.5" y2="71.5"/><line x1="26.2" y1="26.2" x2="20.5" y2="20.5"/><line x1="65.8" y1="26.2" x2="71.5" y2="20.5"/></g><rect x="100" y="22" width="80" height="102" rx="8" fill="#FFFDF7" stroke="#DDD5C3" stroke-width="2"/><rect x="112" y="38" width="56" height="7" rx="3.5" fill="#8C96A3"/><rect x="112" y="54" width="48" height="7" rx="3.5" fill="#8C96A3"/><rect x="112" y="70" width="52" height="7" rx="3.5" fill="#8C96A3"/><circle cx="158" cy="104" r="12" fill="none" stroke="#2F6690" stroke-width="3"/><path d="M 152 104 L 157 109 L 165 99" fill="none" stroke="#2F6690" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="1140" y="238" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#17263A" text-anchor="start">3. A la mañana, te avisa</text>
<text x="1140" y="284" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="start">Lo nuevo de lo que seguís, con</text>
<text x="1140" y="318" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="start">su fuente. Y si no hubo nada,</text>
<text x="1140" y="352" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#4A5361" text-anchor="start">lo dice.</text>
<path d="M 507 215 L 537 215 M 527 205 L 539 215 L 527 225" fill="none" stroke="#B4491F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1057 215 L 1087 215 M 1077 205 L 1089 215 L 1077 225" fill="none" stroke="#B4491F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
