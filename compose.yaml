# El Parte, versión 0, levantado en local: docker compose up --build
# La aplicación queda en http://localhost:8080 y los correos de prueba en http://localhost:8025.
# La clave del modelo se lee del archivo .env de esta carpeta, que no se versiona (T14).
# Los puertos solo se abren en esta máquina (127.0.0.1): nada de esto se ve desde la red. Para
# publicarla se suma compose.publicado.yaml (ADR 0016).

name: el-parte

services:
  base:
    image: postgres:18.7
    environment:
      POSTGRES_DB: elparte
      POSTGRES_USER: elparte
      POSTGRES_PASSWORD: ${BASE_DUENO_CLAVE:-elparte}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - datos-de-la-base:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elparte -d elparte"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Un solo nodo en modo KRaft, broker y controlador a la vez, con la configuración
  # del ejemplo oficial de Apache Kafka para un nodo en texto plano.
  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - datos-de-kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  # Buzón de prueba para los correos del login (D9).
  correo:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  aplicacion:
    build: ./app
    # Las migraciones corren con el dueño de la base, y la aplicación con el rol de los agentes,
    # que no ve el esquema de las cuentas. Las claves de los roles se fijan la primera vez que
    # arranca la base; cambiarlas después no cambia las de los roles ya creados.
    environment:
      BASE_URL: jdbc:postgresql://base:5432/elparte
      BASE_DUENO_USUARIO: elparte
      BASE_DUENO_CLAVE: ${BASE_DUENO_CLAVE:-elparte}
      BASE_USUARIO: elparte_agentes
      BASE_CLAVE: ${BASE_CLAVE:-agentes-local}
      BASE_CLAVE_CUENTAS: ${BASE_CLAVE_CUENTAS:-cuentas-local}
      KAFKA_SERVIDORES: kafka:19092
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-sin-clave}
      ELPARTE_CORRIDA_HORA: ${ELPARTE_CORRIDA_HORA:--}
      CORREO_HOST: correo
      CORREO_PUERTO: 1025
      # En local, el enlace del correo apunta a esta máquina aunque el .env tenga la dirección pública,
      # que es solo de compose.publicado.yaml.
      ELPARTE_URL_PUBLICA: http://localhost:8080
      ELPARTE_REMITENTE: "El Parte <parte@localhost>"
    # La lista de invitados (ELPARTE_INVITADOS_0_CORREO y las demás) va en el .env, que no se versiona,
    # y llega así a la aplicación; si no hay .env, no hay invitados y solo se ve la cuenta de demostración.
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      base:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  datos-de-la-base:
  datos-de-kafka:
